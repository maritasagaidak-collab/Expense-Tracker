{% extends "base.html" %}
{% block content %}
<div style="text-align: center; margin-bottom: 20px;">
    <h2 style="color: #4caf50; margin: 0;">Мій Гаманець</h2>
    <div style="margin: 10px 0;">
        <a href="{{ url_for('expenses.index', curr='USD') }}" style="color: {{ 'white' if currency == 'USD' else '#555' }}; text-decoration: none;">USD</a> |
        <a href="{{ url_for('expenses.index', curr='EUR') }}" style="color: {{ 'white' if currency == 'EUR' else '#555' }}; text-decoration: none;">EUR</a>
    </div>
    <h1 class="balance-display">
        {{ '€' if currency == 'EUR' else '$' }}{{ "%.2f"|format(total) }}
    </h1>
</div>

<!-- Встановлення капіталу -->
<form action="{{ url_for('expenses.set_balance') }}" method="POST">
    <input type="number" step="0.01" name="balance" placeholder="Встановити капітал" required>
    <button type="submit" style="background:#1a2e1e; font-size:12px;">ОК</button>
</form>

<!-- Дохід -->
<form action="{{ url_for('expenses.add_income') }}" method="POST">
    <input type="number" step="0.01" name="amount" placeholder="Сума доходу" required>
    <button type="submit" class="income-btn">+ ДОХІД</button>
</form>

<div class="card"><canvas id="moneyGraph"></canvas></div>

<!-- Витрата з категорією "Інше" -->
<form action="{{ url_for('expenses.add_expense') }}" method="POST">
    <input type="text" name="item" placeholder="На що витратили?" required>
    <input type="number" step="0.01" name="amount" placeholder="Сума" required>
    <select name="category">
        <option value="Їжа">Їжа</option>
        <option value="Розваги">Розваги</option>
        <option value="Майно">Майно</option>
        <option value="Спорт">Спорт</option>
        <option value="Здоров'я">Здоров'я</option>
        <!-- НОВА КАТЕГОРІЯ -->
        <option value="Інше">Інше</option>
    </select>
    <button type="submit" class="expense-btn">- ВИТРАТА</button>
</form>

<a href="{{ url_for('auth.logout') }}" class="logout-link">Вийти</a>

<script>
    const ctx = document.getElementById('moneyGraph').getContext('2d');
    let bal = {{ start_bal }};
    const balanceData = {{ values|tojson }}.map(v => { bal -= v; return bal; });
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ labels|tojson }},
            datasets: [{ data: balanceData, borderColor: '#4caf50', fill: true, tension: 0.4 }]
        },
        options: { plugins: { legend: { display: false } } }
    });
</script>
{% endblock %}
